<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niels Thejls — Visual Designer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: red;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 900px;
      width: 100%;
    }

    .card .box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #111;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .card .title {
      font-size: 18px;
      font-weight: 700;
    }

    .card .subtitle {
      font-size: 14px;
      font-weight: 400;
    }
  </style>
</head>

<body>

  <div class="grid">
    <div class="card">
      <div class="box"></div>
      <div class="title">test text</div>
      <div class="subtitle">test text small</div>
    </div>
    <div class="card">
      <div class="box"></div>
      <div class="title">test text</div>
      <div class="subtitle">test text small</div>
    </div>
    <div class="card">
      <div class="box"></div>
      <div class="title">test text</div>
      <div class="subtitle">test text small</div>
    </div>
    <div class="card">
      <div class="box"></div>
      <div class="title">test text</div>
      <div class="subtitle">test text small</div>
    </div>
    <div class="card">
      <div class="box"></div>
      <div class="title">test text</div>
      <div class="subtitle">test text small</div>
    </div>
    <div class="card">
      <div class="box"></div>
      <div class="title">test text</div>
      <div class="subtitle">test text small</div>
    </div>
  </div>

</body>
</html>
